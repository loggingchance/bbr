name: Build BBR site assets
on:
  push:
    branches: [main]
    paths:
      - site-template.html
      - hero.b64
      - build-assets.py
      - .github/workflows/build-site.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install generators
        run: python -m pip install --quiet pillow reportlab
      - name: Build final site assets
        run: python build-assets.py
      - name: Commit final site and clean build sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og-card.jpg brochure.pdf
          git rm site-template.html hero.b64 build-assets.py .github/workflows/build-site.yml
          git commit -m "Rebuild BBR site with photo hero and inquiry-focused content"
          git push
