name: Generate OG card
on:
  push:
    branches: [main]
    paths:
      - og-card.svg
      - .github/workflows/generate-og.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render social card
        run: |
          rsvg-convert -w 1200 -h 630 og-card.svg -o og-card.png
          convert og-card.png -quality 88 og-card.jpg
          rm og-card.png
      - name: Commit generated card and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-card.jpg
          git rm og-card.svg .github/workflows/generate-og.yml
          git commit -m "Generate Open Graph social preview card"
          git push
